<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildsave Admin</title><link rel="stylesheet" href="admin.css"></head><body><div id="login" class="login"><div><h1>Wildsave ⚡</h1><p>Admin login</p><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="err"></p></div></div><div id="app" class="hidden"><aside><b>Wildsave <span>Admin</span></b><button onclick="tab('dashboard')">📊 Dashboard</button><button onclick="tab('products')">📦 Products</button><button onclick="tab('orders')">🛒 Orders</button><button onclick="logout()">🚪 Logout</button></aside><main><header><h1 id="title">Dashboard</h1></header><section id="dashboard"><div class="stats"><div>Products<strong id="sp">0</strong></div><div>Orders<strong id="so">0</strong></div><div>Customers<strong id="sc">0</strong></div><div>Revenue<strong id="sr">$0</strong></div></div></section><section id="products" class="hidden"><div class="bar"><h2>Products</h2><button onclick="openProduct()">+ Add product</button></div><table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section><section id="orders" class="hidden"><h2>Orders</h2><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="orows"></tbody></table></section></main></div><div id="pm" class="modal"><div class="box"><button onclick="closeProduct()">×</button><h2 id="mt">Add Product</h2><input id="pid" type="hidden"><input id="pn" placeholder="Name"><input id="pc" placeholder="Category"><input id="pp" type="number" step=".01" placeholder="Price"><input id="ps" type="number" placeholder="Stock"><input id="pi" type="hidden">
<label style="display:block;margin:10px 0 6px;font-weight:bold">Product Image</label>
<input id="imageFile" type="file" accept="image/*" style="width:100%;padding:10px">
<img id="imagePreview" style="display:none;width:100%;max-height:180px;object-fit:contain;margin-top:10px;border-radius:8px"><textarea id="pd" placeholder="Description"></textarea><button onclick="saveProduct()">Save</button></div></div><script src="admin.js"></script></body></html>
