<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Wildsave Electrical</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page { max-width: 1100px; margin: 30px auto; padding: 0 18px; }
    .hero { background: white; padding: 30px; border-radius: 14px; margin-bottom: 25px; text-align: center; }
    .hero h2 { font-size: 30px; margin-bottom: 10px; }
    .hero p { color: #64748b; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    .product { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 3px 12px rgba(0,0,0,.07); }
    .product h3 { margin-bottom: 8px; }
    .category { color: #64748b; font-size: 14px; margin-bottom: 15px; }
    .price { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
    .stock { font-size: 14px; margin-bottom: 15px; }
    .add { width: 100%; border: none; padding: 12px; background: #111827; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .add:disabled { background: #94a3b8; cursor: not-allowed; }
    .empty { text-align: center; padding: 30px; color: #64748b; }
  </style>
</head>
<body>

<header>
  <h1>WILDSAVE ELECTRICAL</h1>
  <p>Your trusted electrical store</p>
</header>

<nav class="site-navigation">
  <a href="/">Home</a>
  <a href="/products.html">Products</a>
  <a href="/about.html">About Us</a>
  <a href="/contact.html">Contact Us</a>
  <a href="/group.html">Join Our Group</a>
</nav>

<main class="page">
  <section class="hero">
    <h2>Electrical Products</h2>
    <p>Browse our available products and place your order.</p>
  </section>

  <section id="products" class="products">
    <div class="empty">Loading products...</div>
  </section>
</main>

<footer>
  © 2026 Wildsave Electrical Store
</footer>

<script>
let products = [];

async function loadProducts() {
  try {
    const response = await fetch("/api/products");

    if (!response.ok) {
      throw new Error("Could not load products");
    }

    products = await response.json();
    displayProducts();
  } catch (error) {
    document.getElementById("products").innerHTML =
      '<div class="empty">Could not load products.</div>';
  }
}

function escapeHTML(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

function displayProducts() {
  const container = document.getElementById("products");

  if (products.length === 0) {
    container.innerHTML =
      '<div class="empty">No products available.</div>';
    return;
  }

  container.innerHTML = products.map(product => `
    <div class="product">
      <h3>${escapeHTML(product.name)}</h3>
      <div class="category">${escapeHTML(product.category)}</div>
      <div class="price">$${Number(product.price).toFixed(2)}</div>
      <div class="stock">
        ${product.stock > 0
          ? `${product.stock} available`
          : "Out of stock"}
      </div>
      <button
        class="add"
        ${product.stock <= 0 ? "disabled" : ""}
        onclick="addToCart(${product.id})">
        ${product.stock > 0 ? "Add to Cart" : "Out of Stock"}
      </button>
    </div>
  `).join("");
}

function addToCart(id) {
  const product = products.find(p => p.id === id);
  if (!product) return;

  let cart = JSON.parse(localStorage.getItem("wildsaveCart") || "[]");
  const existing = cart.find(item => item.id === id);

  if (existing) {
    if (existing.qty < product.stock) existing.qty++;
  } else {
    cart.push({ id: product.id, qty: 1 });
  }

  localStorage.setItem("wildsaveCart", JSON.stringify(cart));
  alert("Product added to cart.");
}

loadProducts();
</script>

</body>
</html>
